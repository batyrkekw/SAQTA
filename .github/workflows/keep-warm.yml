# Keeps the free Render API from sleeping (it spins down after 15 idle minutes).
# Pings a liveness route that never touches the database, so Neon can still scale to zero.
# One always-on free service fits Render's 750 free instance hours per month.
# GitHub may delay scheduled runs; the site also shows a "server is waking" notice and retries.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping liveness
        run: curl --silent --show-error --fail --retry 4 --retry-delay 15 --max-time 60 https://saqta-api.onrender.com/api/health/live
