services:
  - type: web
    name: saqta-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Liveness without a database query: Render's frequent health checks must not keep
    # the Neon compute awake (Free plan: 100 CU-hours per month).
    healthCheckPath: /api/health/live
    envVars:
      # Neon connection string (Dashboard → Connect). Set it in the Render dashboard only.
      - key: DATABASE_URL
        sync: false
      - key: WORKSPACE_MODE
        value: real
      - key: AUTO_SEED_DEMO
        value: "false"
      - key: FORECAST_REQUIRES_SUBSCRIPTION
        value: "false"
      - key: CORS_ORIGINS
        sync: false
