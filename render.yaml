services:
  - type: web
    name: saqta-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saqta-postgres
          property: connectionString
      - key: WORKSPACE_MODE
        value: real
      - key: AUTO_SEED_DEMO
        value: "false"
      - key: FORECAST_REQUIRES_SUBSCRIPTION
        value: "false"
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: saqta-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
    databaseName: saqta
    user: saqta
