services:
  - type: web
    name: saqta-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Liveness without a database query: Render's frequent health checks must not keep
    # the Neon compute awake (Free plan: 100 CU-hours per month).
    healthCheckPath: /api/health/live
    envVars:
      # Neon connection string (Dashboard → Connect). Set it in the Render dashboard only.
      - key: DATABASE_URL
        sync: false
      - key: WORKSPACE_MODE
        value: real
      - key: AUTO_SEED_DEMO
        value: "false"
      - key: FORECAST_REQUIRES_SUBSCRIPTION
        value: "true"
      - key: TRIAL_DAYS
        value: "14"
      # Billing and email secrets: set in the Render dashboard only (see backend/.env.example).
      - key: PUBLIC_URL
        sync: false
      - key: TIPTOP_PUBLIC_ID
        sync: false
      - key: TIPTOP_API_SECRET
        sync: false
      - key: BILLING_TEST_MODE
        value: "true"
      # Demo payments without money (works only while TipTop keys are empty). Turn off for real sales.
      - key: BILLING_SIMULATOR
        value: "true"
      - key: SELLER_NAME
        sync: false
      - key: SELLER_BIN
        sync: false
      - key: SELLER_ADDRESS
        sync: false
      - key: SELLER_IBAN
        sync: false
      - key: SELLER_BANK
        sync: false
      - key: SELLER_BIK
        sync: false
      - key: SELLER_EMAIL
        sync: false
      - key: SELLER_PHONE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        sync: false
